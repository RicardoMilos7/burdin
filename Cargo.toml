[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
burdin_diag = { path = "crates/burdin_diag" }
burdin_syntax = { path = "crates/burdin_syntax" }
burdin_fmt = { path = "crates/burdin_fmt" }
burdin_doc = { path = "crates/burdin_doc" }
burdin_tir = { path = "crates/burdin_tir" }
burdin_sema = { path = "crates/burdin_sema" }
burdin_check = { path = "crates/burdin_check" }
burdin_comptime = { path = "crates/burdin_comptime" }
burdin_lint = { path = "crates/burdin_lint" }
burdin_codegen = { path = "crates/burdin_codegen" }
burdin_bindgen = { path = "crates/burdin_bindgen" }
# LLVM 21 is the pinned version. `llvm-sys` finds it through `llvm-config` (or LLVM_SYS_211_PREFIX) and
# `burdin_codegen/build.rs` links the shared library, because the static LLVM libraries do not work on Windows/MSVC.
inkwell = { version = "=0.11.0", default-features = false, features = ["llvm21-1-no-llvm-linking", "target-x86", "target-aarch64"] }
# The C layouts the runtime reads from libc (`struct stat`, `struct dirent`), so metadata and directory
# listings use the host's exact field offsets (issue #411).
libc = "=0.2.191"
