[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
burdin_diag = { path = "crates/burdin_diag" }
burdin_syntax = { path = "crates/burdin_syntax" }
burdin_tir = { path = "crates/burdin_tir" }
burdin_sema = { path = "crates/burdin_sema" }
burdin_check = { path = "crates/burdin_check" }
burdin_codegen = { path = "crates/burdin_codegen" }
# LLVM 21 is the pinned version. llvm-sys finds it through `llvm-config` (or LLVM_SYS_211_PREFIX).
inkwell = { version = "=0.11.0", default-features = false, features = ["llvm21-1-prefer-dynamic", "target-x86", "target-aarch64"] }
