[package]
name = "burdin_fmt"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The formatter reads Burdin source with the compiler's own lexer and checks its output with the compiler's own
# parser, and nothing else: it needs neither a backend nor LLVM (issue #229).

[dependencies]
burdin_diag.workspace = true
burdin_syntax.workspace = true

[dev-dependencies]
burdin_fuzz = { path = "../burdin_fuzz" }
