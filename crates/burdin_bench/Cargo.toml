[package]
name = "burdin_bench"
version.workspace = true
edition.workspace = true
publish.workspace = true

# `cargo bench` must run only the benchmark target below, not the library's test
# harness (which would reject the benchmark's own flags).
[lib]
bench = false

[dependencies]
burdin_diag.workspace = true
burdin_syntax.workspace = true
burdin_tir.workspace = true
burdin_sema.workspace = true
burdin_check.workspace = true
burdin_codegen.workspace = true

[[bench]]
name = "compiler"
harness = false
