name: Release

# Builds the six supported release targets natively, smoke-tests each one, packages versioned archives with SHA-256
# checksums, verifies that the Linux archive is reproducible, and publishes a GitHub release only from a tag push or
# from a manual run that explicitly asks to publish (issues #452-#456, docs/releasing.md).
#
# A manual run without `publish` is a dry run: it builds and verifies every artifact, writes the checksums to the job
# summary, and uploads the bundle without creating a release. The weekly schedule builds the nightly channel the same
# way and never publishes.

on:
  push:
    tags:
      - 'v[0-9]*'
  schedule:
    - cron: '43 5 * * 3'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to build'
        type: choice
        options: [nightly, stable]
        default: nightly
      version:
        description: 'Version override (empty: the manifest version, with a nightly suffix for nightly)'
        type: string
        required: false
      publish:
        description: 'Create a GitHub release from the artifacts'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan the release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu
          manifest=$(python3 tests/build_release.py --print-version)
          channel=nightly
          publish=false
          tag=""
          version=""
          if [ "$EVENT" = push ]; then
            tag=$REF_NAME
            case "$tag" in
              v[0-9]*) ;;
              *) echo "release tags must look like v1.2.3, not $tag" >&2; exit 1 ;;
            esac
            version=${tag#v}
            # A nightly published by hand creates its own tag; rebuilding that tag must not be treated as stable.
            case "$version" in
              *-nightly.*) channel=nightly ;;
              *) channel=stable ;;
            esac
            publish=true
          elif [ "$EVENT" = schedule ]; then
            version="$manifest-nightly.$(date -u +%Y%m%d)"
          else
            channel=$INPUT_CHANNEL
            version=$INPUT_VERSION
            if [ -z "$version" ]; then
              if [ "$channel" = stable ]; then
                version=$manifest
              else
                version="$manifest-nightly.$(date -u +%Y%m%d)"
              fi
            fi
            if [ "$INPUT_PUBLISH" = true ]; then publish=true; fi
          fi
          if [ "$channel" = stable ] && [ "$version" != "$manifest" ]; then
            echo "a stable release must match Cargo.toml ($manifest), not $version; bump the manifest first" >&2
            exit 1
          fi
          case "$version" in
            *[!0-9A-Za-z.+-]*|"") echo "invalid version: $version" >&2; exit 1 ;;
          esac
          [ -n "$tag" ] || tag="v$version"
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "publish=$publish"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Burdin $version ($channel), publish=$publish, tag=$tag"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            family: linux
            arch: x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            family: linux
            arch: arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            family: macos
            arch: x64
          - target: aarch64-apple-darwin
            os: macos-15
            family: macos
            arch: arm64
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            family: windows
            arch: x64
            host_bin: 'HostX64\x64'
            target_env: X86_64_PC_WINDOWS_MSVC
            llvm_asset: clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            family: windows
            arch: arm64
            host_bin: 'Hostarm64\arm64'
            target_env: AARCH64_PC_WINDOWS_MSVC
            llvm_asset: clang+llvm-21.1.8-aarch64-pc-windows-msvc.tar.xz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      BURDIN_VERSION: ${{ needs.plan.outputs.version }}
      BURDIN_CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 (Linux)
        if: matrix.family == 'linux'
        run: |
          # The runner image's package index can be older than the mirror, and a mirror can answer 503 for one package:
          # refresh the index and let apt retry downloads before llvm.sh installs anything.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          bash .github/scripts/retry.sh sudo apt-get update
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          bash .github/scripts/retry.sh sudo ./llvm.sh 21
          bash .github/scripts/retry.sh sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"

      - name: Install LLVM 21 (macOS)
        if: matrix.family == 'macos'
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"

      - name: Set up the MSVC environment
        if: matrix.family == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install LLVM 21 (Windows)
        if: matrix.family == 'windows'
        run: |
          archive=/c/llvm-cache/${{ matrix.llvm_asset }}
          mkdir -p /c/llvm-cache /c/llvm
          if [ ! -f "$archive" ]; then
            curl -fsSL -o "$archive" \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/${{ matrix.llvm_asset }}"
          fi
          tar -xJf "$archive" -C /c/llvm --strip-components=1
          test -f "C:/llvm/lib/LLVM-C.lib"
          echo 'C:\llvm\bin' >> "$GITHUB_PATH"
          echo "LLVM_SYS_211_PREFIX=C:/llvm" >> "$GITHUB_ENV"

      - name: Configure the MSVC linker
        if: matrix.family == 'windows'
        run: |
          linker="${VCToolsInstallDir}bin\\${{ matrix.host_bin }}\\link.exe"
          test -x "$(cygpath -u "$linker")"
          echo "CARGO_TARGET_${{ matrix.target_env }}_LINKER=$linker" >> "$GITHUB_ENV"

      - name: Install Rust (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Verify pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          case "$(rustc --version)" in
            "rustc $channel "*) ;;
            *) echo "expected rustc $channel, got $(rustc --version)"; exit 1 ;;
          esac

      - name: Cache the cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Build, smoke-test, and package
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} tests/build_release.py --target "${{ matrix.target }}" --out dist

      - name: Upload the archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: burdin-${{ needs.plan.outputs.version }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # Reproducibility (issue #455): build the same commit twice from two different checkout paths and require the two
  # archives to have the same SHA-256.
  reproducible:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21
        run: |
          # The runner image's package index can be older than the mirror, and a mirror can answer 503 for one package:
          # refresh the index and let apt retry downloads before llvm.sh installs anything.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          bash .github/scripts/retry.sh sudo apt-get update
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          bash .github/scripts/retry.sh sudo ./llvm.sh 21
          bash .github/scripts/retry.sh sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"

      - name: Install Rust (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache the cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Build twice and compare the archives
        env:
          BURDIN_VERSION: ${{ needs.plan.outputs.version }}
          BURDIN_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: python3 tests/build_release.py --target x86_64-unknown-linux-gnu --verify-reproducible

  release:
    needs: [plan, build, reproducible]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      TAG: ${{ needs.plan.outputs.tag }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 (the installed compiler needs it)
        run: |
          # The runner image's package index can be older than the mirror, and a mirror can answer 503 for one package:
          # refresh the index and let apt retry downloads before llvm.sh installs anything.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          bash .github/scripts/retry.sh sudo apt-get update
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          bash .github/scripts/retry.sh sudo ./llvm.sh 21
          bash .github/scripts/retry.sh sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Aggregate and verify the checksums
        run: |
          set -eu
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          find artifacts -name 'SHA256SUMS.*' -exec cat {} \; | LC_ALL=C sort -k2 > dist/SHA256SUMS
          ( cd dist && sha256sum -c SHA256SUMS )
          count=$(find dist -name '*.tar.gz' | wc -l | tr -d ' ')
          [ "$count" -eq 6 ] || { echo "expected 6 archives, found $count" >&2; exit 1; }
          for target in \
              x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
              x86_64-apple-darwin aarch64-apple-darwin \
              x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            test -f "dist/burdin-$VERSION-$target.tar.gz" \
              || { echo "missing archive for $target" >&2; exit 1; }
          done

      - name: Install from the local bundle and run it
        run: |
          set -eu
          BURDIN_RELEASE_DIR="$PWD/dist" BURDIN_VERSION="$VERSION" \
            BURDIN_TARGET=x86_64-unknown-linux-gnu BURDIN_INSTALL_DIR="$PWD/installed/bin" \
            sh install.sh
          installed/bin/burdin --version
          printf 'fn main() {\n    println("installed release")\n}\n' > installed-smoke.bd
          [ "$(installed/bin/burdin run installed-smoke.bd)" = "installed release" ]

      - name: Check the release pipeline against the installed compiler
        env:
          BURDIN: ${{ github.workspace }}/installed/bin/burdin
          BURDIN_VERSION: ${{ needs.plan.outputs.version }}
        run: python3 tests/check_release.py

      - name: Generate the release notes
        run: |
          set -eu
          if [ "$CHANNEL" = stable ]; then
            python3 tests/release_notes.py --version "$VERSION" --check-links --output NOTES.md
          else
            python3 tests/release_notes.py --unreleased --check-links --output NOTES.md
            { printf '_Nightly build %s._\n\n' "$VERSION"; cat NOTES.md; } > NOTES.nightly
            mv NOTES.nightly NOTES.md
          fi
          test -s NOTES.md

      - name: Create the GitHub release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          args=(--title "Burdin $VERSION" --notes-file NOTES.md)
          if [ "$CHANNEL" = nightly ]; then args+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*.tar.gz dist/SHA256SUMS
          else
            gh release create "$TAG" "${args[@]}" dist/*.tar.gz dist/SHA256SUMS
          fi

      - name: Summarize the dry run
        if: needs.plan.outputs.publish != 'true'
        run: |
          {
            echo "## Burdin $VERSION ($CHANNEL) release dry run"
            echo
            echo "No release was created. The artifacts and checksums are attached to this run."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release bundle
        if: needs.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
