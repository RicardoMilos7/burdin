name: CI

on:
  # A branch is checked by its pull request, so a push runs CI only on main; otherwise every push to an open pull
  # request ran the whole workflow twice. `workflow_dispatch` runs it by hand on any branch.
  push:
    branches: [main]
  pull_request:
  # Continuous fuzzing (issue #447). The committed corpus is replayed by `cargo test --workspace` on every
  # push; the longer deterministic session runs here once a week and by hand.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels the run for the commit it replaces. Runs on main are never cancelled, so
# every commit there records its benchmark baseline.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    # Each OS runs as four parallel parts of one job, so the slowest part sets the wall-clock time instead of the
    # sum of every step: `unit` (fmt, clippy, the Rust tests, the build and codegen checks, benchmarks), `tools`
    # (the black-box checks of the driver's commands), and the conformance suite in the `debug` and `release`
    # profiles, each with its repeated stress tests. Every part builds the driver from its own cargo cache.
    strategy:
      fail-fast: false
      matrix:
        part: [unit, tools, debug, release]
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
    steps:
      - uses: actions/checkout@v4

      - name: Check CI workflow
        if: matrix.part == 'unit'
        run: python3 tests/check_ci.py

      # The cache key is the pinned toolchain plus Cargo.lock, so a toolchain bump or a
      # dependency change starts a fresh cache instead of reusing stale artifacts (issue #46).
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.part }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # LLVM 21 is the slowest download in this job. actions/cache restores as the runner
      # user and cannot write under /usr, so the installed tree is kept in $HOME and copied
      # into place with sudo. A distribution that splits libLLVM or libclang-cpp into the
      # multiarch directory leaves /usr/lib/llvm-21/lib/*.so pointing outside the tree, so
      # the resolved real files are cached under their absolute paths too (issue #46).
      # v3 adds `libclang-21-dev`, which `burdin bindgen` loads at run time (issue #245).
      - name: Cache LLVM 21
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ~/.cache/burdin/llvm-21
          key: ${{ runner.os }}-llvm-21-v4

      - name: Install LLVM 21
        run: |
          cache=~/.cache/burdin/llvm-21
          # The runner image's package index can be older than the mirror, and a mirror can answer 503 for minutes:
          # apt retries each download, and retry.sh retries whole apt and llvm.sh commands with a growing pause.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          if [ "${{ steps.cache-llvm.outputs.cache-hit }}" = "true" ]; then
            sudo rm -rf /usr/lib/llvm-21
            sudo cp -a "$cache/llvm-21" /usr/lib/llvm-21
            if [ -d "$cache/root" ]; then
              sudo cp -a "$cache/root/." /
            fi
            # The runner image's package index can be older than the mirror (gdb's libc6-dbg 404s without this).
            bash .github/scripts/retry.sh sudo apt-get update
            bash .github/scripts/retry.sh sudo apt-get install -y lld libzstd-dev zlib1g-dev gdb
          else
            bash .github/scripts/retry.sh sudo apt-get update
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            bash .github/scripts/retry.sh sudo ./llvm.sh 21
            bash .github/scripts/retry.sh sudo apt-get install -y llvm-21-dev libclang-21-dev libclang-rt-21-dev libpolly-21-dev lld libzstd-dev zlib1g-dev gdb
            mkdir -p "$cache/root"
            sudo cp -a /usr/lib/llvm-21 "$cache/llvm-21"
            # Ubuntu splits the headers and libLLVM out of the tree: the in-tree symlinks
            # would dangle if only /usr/lib/llvm-21 were cached, so keep the real files
            # under their absolute paths too (issue #46).
            for extra in /usr/include/llvm-21 /usr/include/llvm-c-21; do
              if [ -e "$extra" ]; then sudo cp -a --parents "$extra" "$cache/root"; fi
            done
            for link in /usr/lib/llvm-21/lib/libLLVM*.so* /usr/lib/llvm-21/lib/libclang-cpp*.so* \
                        /usr/lib/llvm-21/lib/libclang*.so*; do
              if [ -L "$link" ]; then readlink -f "$link"; fi
            done | sort -u | while read -r target; do
              case "$target" in
                "" | /usr/lib/llvm-21/*) ;;
                *) sudo cp -a --parents "$target" "$cache/root" ;;
              esac
            done
          fi

      # rust-toolchain.toml pins the channel and the clippy/rustfmt components.
      - name: Install Rust (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Verify pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          case "$(rustc --version)" in
            "rustc $channel "*) ;;
            *) echo "expected rustc $channel, got $(rustc --version)"; exit 1 ;;
          esac
          rustup component list --installed | grep -q '^clippy-' || { echo "clippy is missing"; exit 1; }
          rustup component list --installed | grep -q '^rustfmt-' || { echo "rustfmt is missing"; exit 1; }

      - name: Check test directives
        if: matrix.part == 'unit'
        run: python3 tests/check_tests.py

      # Every E9000 site is assigned to a milestone and issue in spec/e9000-audit.md, and no site names a
      # milestone that CI already runs (issue #84).
      - name: Check the E9000 audit
        if: matrix.part == 'unit'
        run: python3 tests/check_e9000.py

      # `cargo test --workspace` below runs the unit tests; this guard fails when a front-end
      # crate or one of the four focused test areas loses them (issue #45).
      - name: Check unit tests
        if: matrix.part == 'unit'
        run: python3 tests/check_unit_tests.py

      - name: Format
        if: matrix.part == 'unit'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.part == 'unit'
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        if: matrix.part == 'unit'
        run: cargo test --workspace

      - name: Build
        run: cargo build

      # The dependency audit (issue #449): every crate in Cargo.lock is reviewed in
      # tests/dependencies.txt, every license is permissive, every direct requirement is an exact
      # pin, and the lockfile is current. It runs after the build so `cargo metadata --locked
      # --offline` can re-verify the license fields from the crates themselves; the verification is
      # required here (BURDIN_DEPS_REQUIRE_METADATA), not best-effort.
      - name: Audit dependencies and licenses
        if: matrix.part == 'unit'
        env:
          BURDIN_DEPS_REQUIRE_METADATA: 1
        run: python3 tests/check_deps.py

      # Source-level debug information, drop-flag and bounds-check elimination, glue sharing, the build flags
      # (--version, --strip, --lto, PGO), and parallel parsing with deterministic diagnostics (issues #422-#432).
      - name: Check debug information
        if: matrix.part == 'unit'
        run: python3 tests/check_debug_info.py

      - name: Check code-generation optimizations
        if: matrix.part == 'unit'
        run: python3 tests/check_codegen_opt.py

      - name: Check build flags and metadata
        if: matrix.part == 'unit'
        run: python3 tests/check_build_flags.py

      # The release pipeline (issues #452-#456): the six-target workflow, versioned archives, SHA-256 checksums,
      # both installers, the version/channel policy, and release notes generated from the changelog.
      - name: Check the release pipeline
        if: matrix.part == 'unit'
        run: python3 tests/check_release.py

      - name: Check parallel analysis
        if: matrix.part == 'unit'
        run: python3 tests/check_parallel.py

      # The benchmark smoke run compiles every stage once and enforces generous time budgets, so a hang or an
      # accidental super-linear change fails CI (issue #41).
      - name: Compiler benchmarks (smoke budgets)
        if: matrix.part == 'unit'
        run: cargo bench -p burdin_bench -- --smoke

      # Benchmark regression tracking (issue #446): the full suite runs and its medians are compared with the
      # baseline cached from the last run of the same kind. The key holds the runner OS and architecture, the
      # pinned toolchain, and Cargo.lock, so a development machine is never compared with a runner. A push to
      # main records the new baseline; a pull request compares against the last main run. The step is advisory
      # for now: `continue-on-error` reports a regression without failing the job until the numbers are stable.
      - name: Restore benchmark baseline
        if: matrix.part == 'unit'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/burdin/bench
          key: bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Compiler benchmarks (regression tracking, advisory)
        if: matrix.part == 'unit'
        continue-on-error: true
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then export BURDIN_BENCH_UPDATE=1; fi
          python3 tests/bench_regression.py

      - name: Save benchmark baseline
        if: matrix.part == 'unit' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/burdin/bench
          key: bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check documentation
        if: matrix.part == 'unit'
        run: python3 tests/check_docs.py

      # Diagnostics presentation (issues #434-#436): color, wrapping, notes and suggestions, the JSON and short
      # formats, the error limit, and deterministic ordering.
      - name: Check diagnostics behavior
        if: matrix.part == 'tools'
        run: python3 tests/check_diagnostics.py

      # The user-facing error-code reference (issue #437): every code, every example compiled, and
      # `burdin explain`.
      - name: Check the error-code reference
        if: matrix.part == 'tools'
        run: python3 tests/check_error_docs.py

      # The black-box checks of `burdin test`: attributes, parallelism, output capture, isolation, and discovery
      # (issues #438-#443).
      - name: Check the test runner
        if: matrix.part == 'tools'
        run: python3 tests/check_test_runner.py

      # `--sanitize` (issue #620, spec/sanitizers.md): one program per bug class under tests/sanitize/, each
      # reported by its sanitizer where the host has it and rejected with a usage error where it does not.
      - name: Check sanitizers
        if: matrix.part == 'tools'
        run: python3 tests/check_sanitizers.py

      # `burdin test --interpret` (issue #622, spec/test-runner.md): one fixture per strict-check class, plus std
      # code run in the interpreter.
      - name: Check the interpreter
        if: matrix.part == 'tools'
        run: python3 tests/check_interpret.py

      # `burdin fuzz` (issue #618, spec/fuzz.md): a target with a planted bug, fuzzed for at most 60 seconds, and
      # the saved crash replayed through `burdin test --fuzz-replay`.
      - name: Check fuzzing
        if: matrix.part == 'tools'
        run: python3 tests/check_fuzz.py

      # The black-box checks of `burdin bench`: measurement, statistics, the report formats, selection, baselines,
      # and the profiler hook (issues #251, #653-#655).
      - name: Check the bench runner
        if: matrix.part == 'tools'
        run: python3 tests/check_bench.py

      # The black-box checks of `burdin fmt`: golden outputs, idempotence, --check, --stdin, --range, import
      # grouping, doc-comment code blocks, and the tricky sources (issues #229, #460-#463, #659, #660).
      - name: Check the formatter
        if: matrix.part == 'tools'
        run: python3 tests/check_fmt.py

      # `burdin lint` (issues #230-#233, #464-#466, #661): every documented lint, the fixtures under tests/lint,
      # `--fix` against golden files, levels, suppression comments, and the manifest `[lint]` table.
      - name: Check the linter
        if: matrix.part == 'tools'
        run: python3 tests/check_lint.py

      # `burdin fix` and the editions (issues #604, #606, #607, #609): the suggestion model, the fix loop, the dirty
      # tree, `--dry-run`, and `--migrate`.
      - name: Check burdin fix
        if: matrix.part == 'tools'
        run: python3 tests/check_fix.py

      # `burdin ssr` (issue #611): structural search and replace, with placeholders, type constraints, and names that
      # match by resolution.
      - name: Check burdin ssr
        if: matrix.part == 'tools'
        run: python3 tests/check_ssr.py

      # `burdin refactor` (issue #613): extract, inline, change a signature, and move an item, each with its refusal.
      - name: Check burdin refactor
        if: matrix.part == 'tools'
        run: python3 tests/check_refactor.py

      # `burdin doc` (issues #234, #467-#469, #656-#658): the site and its golden pages, intra-doc links and their
      # diagnostics, private items, the JSON schema, the coverage report, and the output directory.
      - name: Check burdin doc
        if: matrix.part == 'tools'
        run: python3 tests/check_doc.py

      # Build-script caching, declared and embedded inputs, --emit-deps, and the bindgen command line (issue #177).
      - name: Check build scripts
        if: matrix.part == 'tools'
        run: python3 tests/check_build_scripts.py

      # The linker choice (issue #335): mold/lld when installed, `BURDIN_LD`, the platform fallback, an error that
      # names the choice, and the link time against the platform linker's.
      - name: Check the linker choice
        if: matrix.part == 'tools'
        run: python3 tests/check_linker.py

      # `burdin bindgen` through libclang and `burdin bindgen --export` (issues #244-#248, #475, #476, #663):
      # the golden modules, the generated code compiled and run, the wrappers built with the system C compiler,
      # and the header a C library compiles and links against.
      - name: Check bindgen
        if: matrix.part == 'tools'
        run: python3 tests/check_bindgen.py

      # Rust interop (issues #249, #477): `burdin bindgen --rust` on a fixture crate against its golden shim and
      # module, the shim built with the pinned toolchain and its layout checks, and a package with
      # `[rust.crates]` built, cached, and run.
      - name: Check Rust interop
        if: matrix.part == 'tools'
        run: python3 tests/check_rust_interop.py

      # `burdin new`: the generated package, refusing to overwrite, invalid names, and the command line (issue #228).
      - name: Check burdin new
        if: matrix.part == 'tools'
        run: python3 tests/check_new.py

      # `burdin add` and `burdin.lock`: path and git dependencies (local repositories), the golden manifest and
      # lockfile, `--locked` on a stale lockfile, checksums, and failures that change nothing (issues #238, #239).
      - name: Check burdin add and burdin.lock
        if: matrix.part == 'tools'
        run: python3 tests/check_packages.py

      # `burdin clean`, `burdin package`, `burdin vendor`, and `--offline` (issue #350): the archive's selection and
      # bytes, the vendored copy, and offline builds after the git cache and the repository are deleted.
      - name: Check clean, package, vendor, and --offline
        if: matrix.part == 'tools'
        run: python3 tests/check_package_tools.py

      # The `json` official package (issue #255): the tests/json fixtures (round trips, pretty output, and malformed
      # input with its line, column, and path), `burdin add json`, and the official pin that `--locked` enforces.
      - name: Check the json package
        if: matrix.part == 'tools'
        run: python3 tests/check_json.py

      - name: Check the csv package
        if: matrix.part == 'tools'
        run: python3 tests/check_csv.py

      - name: Check the yaml package
        if: matrix.part == 'tools'
        run: python3 tests/check_yaml.py

      - name: Check the xml package
        if: matrix.part == 'tools'
        run: python3 tests/check_xml.py

      # The toolchain manager and the `burdin` proxy (issues #624, #626, #628, #630, #631; spec/toolchain.md): fixture
      # releases with a fake compiler, install/update/list/default/remove, selection and burdin-toolchain.toml,
      # resumed and verified downloads (also over HTTP), components and targets, the installer's bootstrap, and
      # self show/update/uninstall.
      - name: Check the toolchain manager
        if: matrix.part == 'tools'
        run: python3 tests/check_toolchain.py

      # `burdin check`: the fixtures under tests/check and the whole conformance suite, which `check` must accept or
      # reject exactly as a build does, without code generation or a linker (issue #237).
      - name: Check burdin check
        if: matrix.part == 'tools'
        run: python3 tests/check_check.py

      # The inspection commands: `burdin expand` (its golden outputs, and every conformance program of m17, m19, m20,
      # and m21 expanded, checked again, and run), `--emit`, `burdin asm`, `burdin bloat`, and `burdin check
      # --print-instances` (issue #595, spec/inspect.md).
      - name: Check the inspection commands
        if: matrix.part == 'tools'
        run: python3 tests/check_inspect.py

      # `burdin lsp` from the driver: a test run through a lens with the real `burdin test`, the exit codes, and the
      # editor files (spec/lsp.md, LS19-LS20). The JSON-RPC integration tests run in `cargo test --workspace`.
      - name: Check burdin lsp
        if: matrix.part == 'tools'
        run: python3 tests/check_lsp.py

      # The debugger integration (issue #565): the panic hook, the symbolized frames, the embedded gdb printers,
      # the lldb formatters, the Natvis file, and `burdin debug` (spec/debug.md, DBG1-DBG10). gdb and lldb are
      # optional; the check records a skip for each one that is missing.
      - name: Check the debugger printers
        if: matrix.part == 'tools'
        run: python3 tests/check_debug_printers.py

      # `burdin dap` (issue #576): the panic filter, the merged function breakpoints, glue-skipping steps, and a
      # `target` built from a launch request, driven against a stub backend (spec/debug.md, DBG11).
      - name: Check burdin dap
        if: matrix.part == 'tools'
        run: python3 tests/check_dap.py

      # `burdin repl` (spec/repl.md): the scripted sessions under tests/repl, compared with their golden
      # transcripts, plus :ir and :compile (issues #580, #582, #584).
      - name: Check the REPL
        if: matrix.part == 'tools'
        run: python3 tests/check_repl.py

      # Single-file scripts (spec/scripts.md): the shebang, the inline dependency fragment, and the content-keyed
      # binary cache, checked with a deliberately broken linker (issue #586).
      - name: Check scripts
        if: matrix.part == 'tools'
        run: python3 tests/check_scripts.py

      # `burdin watch` (spec/watch.md): reruns on edits, ignored files, `run` restarts, and the changed-modules-first
      # `test` run (issue #632).
      - name: Check watch mode
        if: matrix.part == 'tools'
        run: python3 tests/check_watch.py

      # The artifact cache of a package's target directory (spec/target.md, issue #353): the layout, the content key,
      # the failure paths, and the debug bypass, checked with a deliberately broken linker.
      - name: Check target cache
        if: matrix.part == 'tools'
        run: python3 tests/check_target.py

      - name: Check host target
        if: matrix.part == 'unit'
        run: python3 tests/check_platform.py

      # The platform support matrix and its known limitations (issue #457): the page must agree with this
      # workflow, its example must run, and standard output and file I/O must stay binary-safe.
      - name: Check platform support matrix
        if: matrix.part == 'unit'
        run: python3 tests/check_platform_support.py

      # Only milestones that are finished must pass. Extend the list as milestones are completed.
      - name: Conformance tests (finished milestones)
        if: matrix.part == 'debug'
        run: python3 tests/run_tests.py m01 m02 m03 m04 m05 m06 m07 m08 m09 m10 m11 m12 m13 m14 m15 m16 m17 m18 m19 m20 m21 m22 m23 m24 s2_tasks s2_channels s2_shared s2_io s3_bench s3_scripts s3_serialize

      # Overflow panics in debug and wraps in release, so the finished milestones also run under
      # the release profile, which exercises release code generation; tests marked debug-only are
      # skipped (issue #47).
      # The stage 0 and stage 1 suite under AddressSanitizer (issue #620): a memory error or a leak in the code the
      # compiler generates fails a test. It doubles the debug part's time, so it runs on the weekly schedule or by
      # hand, like the fuzz job.
      - name: Conformance tests under AddressSanitizer (scheduled)
        if: matrix.part == 'debug' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python3 tests/run_tests.py --sanitize address m01 m02 m03 m04 m05 m06 m07 m08 m09 m10 m11 m12 m13 m14 m15 m16 m17 m18 m19 m20 m21 m22 m23 m24

      - name: Conformance tests (release profile)
        if: matrix.part == 'release'
        run: python3 tests/run_tests.py --release m01 m02 m03 m04 m05 m06 m07 m08 m09 m10 m11 m12 m13 m14 m15 m16 m17 m18 m19 m20 m21 m22 m23 m24 s2_tasks s2_channels s2_shared s2_io s3_bench s3_scripts s3_serialize

      # The incremental equivalence sweep is slow, so the wider one runs once, in release: after every edit of a
      # long sequence, the edited database must answer like a fresh one (spec/query.md, QL4). `cargo test
      # --workspace` runs the smaller sweep in every job.
      - name: Incremental equivalence sweep
        if: matrix.part == 'unit'
        env:
          BURDIN_EQUIV_FILES: 40
          BURDIN_EQUIV_STEPS: 8
        run: cargo test --release -p burdin_query --test equivalence

      # The stress tests of the channels catch a lost wake-up or a race only now and then, so they run
      # many times, in both profiles (issue #209).
      - name: Channel and shared-state stress tests (repeated, debug)
        if: matrix.part == 'debug'
        run: |
          python3 tests/run_tests.py --repeat 20 s2_channels/stress s2_channels/select_stress s2_channels/ping_pong
          python3 tests/run_tests.py --repeat 20 s2_shared/stress s2_shared/shared_count_stress
          python3 tests/run_tests.py --repeat 20 s2_io/stress s2_io/net_tcp_messages s2_io/channel_watchdog

      - name: Channel and shared-state stress tests (repeated, release)
        if: matrix.part == 'release'
        run: |
          python3 tests/run_tests.py --release --repeat 20 s2_channels/stress s2_channels/select_stress s2_channels/ping_pong
          python3 tests/run_tests.py --release --repeat 20 s2_shared/stress s2_shared/shared_count_stress
          python3 tests/run_tests.py --release --repeat 20 s2_io/stress s2_io/net_tcp_messages s2_io/channel_watchdog

  # macOS on arm64: proves the host-triple target, the C libc calls, and LLVM-C linking on Apple's
  # toolchain (issues #16, #17, #18). Homebrew's LLVM is keg-only, so point inkwell at its prefix and
  # put its llvm-config on PATH for `--link-lib LLVM-C`.
  macos:
    runs-on: macos-latest
    # Each OS runs as four parallel parts of one job, so the slowest part sets the wall-clock time instead of the
    # sum of every step: `unit` (fmt, clippy, the Rust tests, the build and codegen checks, benchmarks), `tools`
    # (the black-box checks of the driver's commands), and the conformance suite in the `debug` and `release`
    # profiles, each with its repeated stress tests. Every part builds the driver from its own cargo cache.
    strategy:
      fail-fast: false
      matrix:
        part: [unit, tools, debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Check CI workflow
        if: matrix.part == 'unit'
        run: python3 tests/check_ci.py

      # The cache key is the pinned toolchain plus Cargo.lock, so a toolchain bump or a
      # dependency change starts a fresh cache instead of reusing stale artifacts (issue #46).
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.part }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # Homebrew pours llvm@21 from a bottle. Cache the downloads so a warm run does not
      # fetch the bottle and its dependencies again. `brew install` still runs, because the
      # keg is not self-contained: Homebrew must install the libraries it links against
      # (issue #46).
      - name: Cache Homebrew downloads for LLVM 21
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-llvm-21

      - name: Install LLVM 21
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"

      # rust-toolchain.toml pins the channel and the clippy/rustfmt components.
      - name: Install Rust (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Verify pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          case "$(rustc --version)" in
            "rustc $channel "*) ;;
            *) echo "expected rustc $channel, got $(rustc --version)"; exit 1 ;;
          esac
          rustup component list --installed | grep -q '^clippy-' || { echo "clippy is missing"; exit 1; }
          rustup component list --installed | grep -q '^rustfmt-' || { echo "rustfmt is missing"; exit 1; }

      - name: Check test directives
        if: matrix.part == 'unit'
        run: python3 tests/check_tests.py

      # Every E9000 site is assigned to a milestone and issue in spec/e9000-audit.md, and no site names a
      # milestone that CI already runs (issue #84).
      - name: Check the E9000 audit
        if: matrix.part == 'unit'
        run: python3 tests/check_e9000.py

      # `cargo test --workspace` below runs the unit tests; this guard fails when a front-end
      # crate or one of the four focused test areas loses them (issue #45).
      - name: Check unit tests
        if: matrix.part == 'unit'
        run: python3 tests/check_unit_tests.py

      - name: Format
        if: matrix.part == 'unit'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.part == 'unit'
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        if: matrix.part == 'unit'
        run: cargo test --workspace

      - name: Build
        run: cargo build

      # The dependency audit (issue #449): every crate in Cargo.lock is reviewed in
      # tests/dependencies.txt, every license is permissive, every direct requirement is an exact
      # pin, and the lockfile is current. It runs after the build so `cargo metadata --locked
      # --offline` can re-verify the license fields from the crates themselves; the verification is
      # required here (BURDIN_DEPS_REQUIRE_METADATA), not best-effort.
      - name: Audit dependencies and licenses
        if: matrix.part == 'unit'
        env:
          BURDIN_DEPS_REQUIRE_METADATA: 1
        run: python3 tests/check_deps.py

      # Source-level debug information, drop-flag and bounds-check elimination, glue sharing, the build flags
      # (--version, --strip, --lto, PGO), and parallel parsing with deterministic diagnostics (issues #422-#432).
      - name: Check debug information
        if: matrix.part == 'unit'
        run: python3 tests/check_debug_info.py

      - name: Check code-generation optimizations
        if: matrix.part == 'unit'
        run: python3 tests/check_codegen_opt.py

      - name: Check build flags and metadata
        if: matrix.part == 'unit'
        run: python3 tests/check_build_flags.py

      # The release pipeline (issues #452-#456): the six-target workflow, versioned archives, SHA-256 checksums,
      # both installers, the version/channel policy, and release notes generated from the changelog.
      - name: Check the release pipeline
        if: matrix.part == 'unit'
        run: python3 tests/check_release.py

      - name: Check parallel analysis
        if: matrix.part == 'unit'
        run: python3 tests/check_parallel.py

      # The benchmark smoke run compiles every stage once and enforces generous time budgets, so a hang or an
      # accidental super-linear change fails CI (issue #41).
      - name: Compiler benchmarks (smoke budgets)
        if: matrix.part == 'unit'
        run: cargo bench -p burdin_bench -- --smoke

      # Benchmark regression tracking (issue #446): the full suite runs and its medians are compared with the
      # baseline cached from the last run of the same kind. The key holds the runner OS and architecture, the
      # pinned toolchain, and Cargo.lock, so a development machine is never compared with a runner. A push to
      # main records the new baseline; a pull request compares against the last main run. The step is advisory
      # for now: `continue-on-error` reports a regression without failing the job until the numbers are stable.
      - name: Restore benchmark baseline
        if: matrix.part == 'unit'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/burdin/bench
          key: bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Compiler benchmarks (regression tracking, advisory)
        if: matrix.part == 'unit'
        continue-on-error: true
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then export BURDIN_BENCH_UPDATE=1; fi
          python3 tests/bench_regression.py

      - name: Save benchmark baseline
        if: matrix.part == 'unit' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/burdin/bench
          key: bench-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check documentation
        if: matrix.part == 'unit'
        run: python3 tests/check_docs.py

      # Diagnostics presentation (issues #434-#436): color, wrapping, notes and suggestions, the JSON and short
      # formats, the error limit, and deterministic ordering.
      - name: Check diagnostics behavior
        if: matrix.part == 'tools'
        run: python3 tests/check_diagnostics.py

      # The user-facing error-code reference (issue #437): every code, every example compiled, and
      # `burdin explain`.
      - name: Check the error-code reference
        if: matrix.part == 'tools'
        run: python3 tests/check_error_docs.py

      # The black-box checks of `burdin test`: attributes, parallelism, output capture, isolation, and discovery
      # (issues #438-#443).
      - name: Check the test runner
        if: matrix.part == 'tools'
        run: python3 tests/check_test_runner.py

      # `--sanitize` (issue #620, spec/sanitizers.md): one program per bug class under tests/sanitize/, each
      # reported by its sanitizer where the host has it and rejected with a usage error where it does not.
      - name: Check sanitizers
        if: matrix.part == 'tools'
        run: python3 tests/check_sanitizers.py

      # `burdin test --interpret` (issue #622, spec/test-runner.md): one fixture per strict-check class, plus std
      # code run in the interpreter.
      - name: Check the interpreter
        if: matrix.part == 'tools'
        run: python3 tests/check_interpret.py

      # `burdin fuzz` (issue #618, spec/fuzz.md): a target with a planted bug, fuzzed for at most 60 seconds, and
      # the saved crash replayed through `burdin test --fuzz-replay`.
      - name: Check fuzzing
        if: matrix.part == 'tools'
        run: python3 tests/check_fuzz.py

      # The black-box checks of `burdin bench`: measurement, statistics, the report formats, selection, baselines,
      # and the profiler hook (issues #251, #653-#655).
      - name: Check the bench runner
        if: matrix.part == 'tools'
        run: python3 tests/check_bench.py

      # The black-box checks of `burdin fmt`: golden outputs, idempotence, --check, --stdin, --range, import
      # grouping, doc-comment code blocks, and the tricky sources (issues #229, #460-#463, #659, #660).
      - name: Check the formatter
        if: matrix.part == 'tools'
        run: python3 tests/check_fmt.py

      # `burdin lint` (issues #230-#233, #464-#466, #661): every documented lint, the fixtures under tests/lint,
      # `--fix` against golden files, levels, suppression comments, and the manifest `[lint]` table.
      - name: Check the linter
        if: matrix.part == 'tools'
        run: python3 tests/check_lint.py

      # `burdin fix` and the editions (issues #604, #606, #607, #609): the suggestion model, the fix loop, the dirty
      # tree, `--dry-run`, and `--migrate`.
      - name: Check burdin fix
        if: matrix.part == 'tools'
        run: python3 tests/check_fix.py

      # `burdin ssr` (issue #611): structural search and replace, with placeholders, type constraints, and names that
      # match by resolution.
      - name: Check burdin ssr
        if: matrix.part == 'tools'
        run: python3 tests/check_ssr.py

      # `burdin refactor` (issue #613): extract, inline, change a signature, and move an item, each with its refusal.
      - name: Check burdin refactor
        if: matrix.part == 'tools'
        run: python3 tests/check_refactor.py

      # `burdin doc` (issues #234, #467-#469, #656-#658): the site and its golden pages, intra-doc links and their
      # diagnostics, private items, the JSON schema, the coverage report, and the output directory.
      - name: Check burdin doc
        if: matrix.part == 'tools'
        run: python3 tests/check_doc.py

      # Build-script caching, declared and embedded inputs, --emit-deps, and the bindgen command line (issue #177).
      - name: Check build scripts
        if: matrix.part == 'tools'
        run: python3 tests/check_build_scripts.py

      # The linker choice (issue #335): mold/lld when installed, `BURDIN_LD`, the platform fallback, an error that
      # names the choice, and the link time against the platform linker's.
      - name: Check the linker choice
        if: matrix.part == 'tools'
        run: python3 tests/check_linker.py

      # `burdin bindgen` through libclang and `burdin bindgen --export` (issues #244-#248, #475, #476, #663):
      # the golden modules, the generated code compiled and run, the wrappers built with the system C compiler,
      # and the header a C library compiles and links against.
      - name: Check bindgen
        if: matrix.part == 'tools'
        run: python3 tests/check_bindgen.py

      # Rust interop (issues #249, #477): `burdin bindgen --rust` on a fixture crate against its golden shim and
      # module, the shim built with the pinned toolchain and its layout checks, and a package with
      # `[rust.crates]` built, cached, and run.
      - name: Check Rust interop
        if: matrix.part == 'tools'
        run: python3 tests/check_rust_interop.py

      # `burdin new`: the generated package, refusing to overwrite, invalid names, and the command line (issue #228).
      - name: Check burdin new
        if: matrix.part == 'tools'
        run: python3 tests/check_new.py

      # `burdin add` and `burdin.lock`: path and git dependencies (local repositories), the golden manifest and
      # lockfile, `--locked` on a stale lockfile, checksums, and failures that change nothing (issues #238, #239).
      - name: Check burdin add and burdin.lock
        if: matrix.part == 'tools'
        run: python3 tests/check_packages.py

      # `burdin clean`, `burdin package`, `burdin vendor`, and `--offline` (issue #350): the archive's selection and
      # bytes, the vendored copy, and offline builds after the git cache and the repository are deleted.
      - name: Check clean, package, vendor, and --offline
        if: matrix.part == 'tools'
        run: python3 tests/check_package_tools.py

      # The `json` official package (issue #255): the tests/json fixtures (round trips, pretty output, and malformed
      # input with its line, column, and path), `burdin add json`, and the official pin that `--locked` enforces.
      - name: Check the json package
        if: matrix.part == 'tools'
        run: python3 tests/check_json.py

      - name: Check the csv package
        if: matrix.part == 'tools'
        run: python3 tests/check_csv.py

      - name: Check the yaml package
        if: matrix.part == 'tools'
        run: python3 tests/check_yaml.py

      - name: Check the xml package
        if: matrix.part == 'tools'
        run: python3 tests/check_xml.py

      # The toolchain manager and the `burdin` proxy (issues #624, #626, #628, #630, #631; spec/toolchain.md): fixture
      # releases with a fake compiler, install/update/list/default/remove, selection and burdin-toolchain.toml,
      # resumed and verified downloads (also over HTTP), components and targets, the installer's bootstrap, and
      # self show/update/uninstall.
      - name: Check the toolchain manager
        if: matrix.part == 'tools'
        run: python3 tests/check_toolchain.py

      # `burdin check`: the fixtures under tests/check and the whole conformance suite, which `check` must accept or
      # reject exactly as a build does, without code generation or a linker (issue #237).
      - name: Check burdin check
        if: matrix.part == 'tools'
        run: python3 tests/check_check.py

      # The inspection commands: `burdin expand` (its golden outputs, and every conformance program of m17, m19, m20,
      # and m21 expanded, checked again, and run), `--emit`, `burdin asm`, `burdin bloat`, and `burdin check
      # --print-instances` (issue #595, spec/inspect.md).
      - name: Check the inspection commands
        if: matrix.part == 'tools'
        run: python3 tests/check_inspect.py

      # `burdin lsp` from the driver: a test run through a lens with the real `burdin test`, the exit codes, and the
      # editor files (spec/lsp.md, LS19-LS20). The JSON-RPC integration tests run in `cargo test --workspace`.
      - name: Check burdin lsp
        if: matrix.part == 'tools'
        run: python3 tests/check_lsp.py

      # The debugger integration (issue #565): the panic hook, the symbolized frames, the embedded gdb printers,
      # the lldb formatters, the Natvis file, and `burdin debug` (spec/debug.md, DBG1-DBG10). gdb and lldb are
      # optional; the check records a skip for each one that is missing.
      - name: Check the debugger printers
        if: matrix.part == 'tools'
        run: python3 tests/check_debug_printers.py

      # `burdin dap` (issue #576): the panic filter, the merged function breakpoints, glue-skipping steps, and a
      # `target` built from a launch request, driven against a stub backend (spec/debug.md, DBG11).
      - name: Check burdin dap
        if: matrix.part == 'tools'
        run: python3 tests/check_dap.py

      # `burdin repl` (spec/repl.md): the scripted sessions under tests/repl, compared with their golden
      # transcripts, plus :ir and :compile (issues #580, #582, #584).
      - name: Check the REPL
        if: matrix.part == 'tools'
        run: python3 tests/check_repl.py

      # Single-file scripts (spec/scripts.md): the shebang, the inline dependency fragment, and the content-keyed
      # binary cache, checked with a deliberately broken linker (issue #586).
      - name: Check scripts
        if: matrix.part == 'tools'
        run: python3 tests/check_scripts.py

      # `burdin watch` (spec/watch.md): reruns on edits, ignored files, `run` restarts, and the changed-modules-first
      # `test` run (issue #632).
      - name: Check watch mode
        if: matrix.part == 'tools'
        run: python3 tests/check_watch.py

      # The artifact cache of a package's target directory (spec/target.md, issue #353): the layout, the content key,
      # the failure paths, and the debug bypass, checked with a deliberately broken linker.
      - name: Check target cache
        if: matrix.part == 'tools'
        run: python3 tests/check_target.py

      # The LLVM target machine, isize/usize width, and generated object must follow the arm64 host.
      - name: Check host target
        if: matrix.part == 'unit'
        run: python3 tests/check_platform.py

      # The platform support matrix and its known limitations (issue #457): the page must agree with this
      # workflow, its example must run, and standard output and file I/O must stay binary-safe.
      - name: Check platform support matrix
        if: matrix.part == 'unit'
        run: python3 tests/check_platform_support.py

      # Only milestones that are finished must pass. Extend the list as milestones are completed.
      - name: Conformance tests (finished milestones)
        if: matrix.part == 'debug'
        run: python3 tests/run_tests.py -v m01 m02 m03 m04 m05 m06 m07 m08 m09 m10 m11 m12 m13 m14 m15 m16 m17 m18 m19 m20 m21 m22 m23 m24 s2_tasks s2_channels s2_shared s2_io s3_bench s3_scripts s3_serialize

      # Overflow panics in debug and wraps in release, so the finished milestones also run under
      # the release profile, which exercises release code generation; tests marked debug-only are
      # skipped (issue #47).
      - name: Conformance tests (release profile)
        if: matrix.part == 'release'
        run: python3 tests/run_tests.py -v --release m01 m02 m03 m04 m05 m06 m07 m08 m09 m10 m11 m12 m13 m14 m15 m16 m17 m18 m19 m20 m21 m22 m23 m24 s2_tasks s2_channels s2_shared s2_io s3_bench s3_scripts s3_serialize

      # The stress tests of the channels catch a lost wake-up or a race only now and then, so they run
      # many times, in both profiles (issue #209).
      - name: Channel and shared-state stress tests (repeated, debug)
        if: matrix.part == 'debug'
        run: |
          python3 tests/run_tests.py -v --repeat 20 s2_channels/stress s2_channels/select_stress s2_channels/ping_pong
          python3 tests/run_tests.py -v --repeat 20 s2_shared/stress s2_shared/shared_count_stress
          python3 tests/run_tests.py -v --repeat 20 s2_io/stress s2_io/net_tcp_messages s2_io/channel_watchdog

      - name: Channel and shared-state stress tests (repeated, release)
        if: matrix.part == 'release'
        run: |
          python3 tests/run_tests.py -v --release --repeat 20 s2_channels/stress s2_channels/select_stress s2_channels/ping_pong
          python3 tests/run_tests.py -v --release --repeat 20 s2_shared/stress s2_shared/shared_count_stress
          python3 tests/run_tests.py -v --release --repeat 20 s2_io/stress s2_io/net_tcp_messages s2_io/channel_watchdog

  windows:
    runs-on: windows-latest
    # Each OS runs as four parallel parts of one job, so the slowest part sets the wall-clock time instead of the
    # sum of every step: `unit` (fmt, clippy, the Rust tests, the build and codegen checks, benchmarks), `tools`
    # (the black-box checks of the driver's commands), and the conformance suite in the `debug` and `release`
    # profiles, each with its repeated stress tests. Every part builds the driver from its own cargo cache.
    strategy:
      fail-fast: false
      matrix:
        part: [unit, tools, debug, release]
    defaults:
      run:
        shell: bash
    env:
      LLVM_SYS_211_PREFIX: C:/llvm
    steps:
      - uses: actions/checkout@v4

      - name: Check CI workflow
        if: matrix.part == 'unit'
        run: python tests/check_ci.py

      # `cl` is not on PATH until the Visual Studio environment is loaded. This action exports INCLUDE, LIB,
      # PATH, and the rest to the steps that follow, exactly like a Developer Command Prompt.
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Git for Windows ships a coreutils `link.exe` in `usr/bin`. On the current runner image rustc can pick it
      # up instead of MSVC's linker, which fails with "extra operand" while linking build scripts. Name the
      # MSVC linker for the target explicitly so the choice does not depend on PATH order.
      - name: Configure the MSVC linker
        run: |
          linker="${VCToolsInstallDir}bin\\HostX64\\x64\\link.exe"
          test -x "$(cygpath -u "$linker")"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> "$GITHUB_ENV"

      # The cache key is the pinned toolchain plus Cargo.lock, so a toolchain bump or a
      # dependency change starts a fresh cache instead of reusing stale artifacts (issue #46).
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.part }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # The official Windows release archive is the only LLVM 21 distribution that ships llvm-config.exe
      # (llvm-sys needs it) and the LLVM-C import library. It is ~900 MB, so the archive is cached and the job
      # only downloads it on the first run; the unpacked tree is four times larger and not worth caching (#46).
      - name: Cache LLVM 21
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:/llvm-cache/llvm.tar.xz
          key: ${{ runner.os }}-llvm-21

      - name: Install LLVM 21
        run: |
          archive=/c/llvm-cache/llvm.tar.xz
          if [ "${{ steps.cache-llvm.outputs.cache-hit }}" != "true" ]; then
            mkdir -p /c/llvm-cache
            curl -fsSL -o "$archive" \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz"
          fi
