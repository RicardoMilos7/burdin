      # pin, and the lockfile is current. It runs after the build so `cargo metadata --locked
      # --offline` can re-verify the license fields from the crates themselves; the verification is
      # required here (BURDIN_DEPS_REQUIRE_METADATA), not best-effort.
      - name: Audit dependencies and licenses
