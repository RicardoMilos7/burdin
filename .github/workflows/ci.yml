      # main records the new baseline; a pull request compares against the last main run. The step is advisory
      # for now: `continue-on-error` reports a regression without failing the job until the numbers are stable.
      - name: Restore benchmark baseline
        if: matrix.part == 'unit'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/burdin/bench
