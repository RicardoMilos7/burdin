name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
    steps:
      - uses: actions/checkout@v4

      - name: Check CI workflow
        run: tests/check-ci.sh

      # The cache key is the pinned toolchain plus Cargo.lock, so a toolchain bump or a
      # dependency change starts a fresh cache instead of reusing stale artifacts (issue #46).
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # LLVM 21 is the slowest download in this job. actions/cache restores as the runner
      # user and cannot write under /usr, so the installed tree is kept in $HOME and copied
      # into place with sudo. A distribution that splits libLLVM into the multiarch
      # directory leaves /usr/lib/llvm-21/lib/libLLVM*.so pointing outside the tree, so the
      # resolved real files are cached under their absolute paths too (issue #46).
      - name: Cache LLVM 21
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ~/.cache/burdin/llvm-21
          key: ${{ runner.os }}-llvm-21

      - name: Install LLVM 21
        run: |
          cache=~/.cache/burdin/llvm-21
          if [ "${{ steps.cache-llvm.outputs.cache-hit }}" = "true" ]; then
            sudo rm -rf /usr/lib/llvm-21
            sudo cp -a "$cache/llvm-21" /usr/lib/llvm-21
            if [ -d "$cache/root" ]; then
              sudo cp -a "$cache/root/." /
            fi
            sudo apt-get install -y libzstd-dev zlib1g-dev
          else
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 21
            sudo apt-get install -y llvm-21-dev libpolly-21-dev libzstd-dev zlib1g-dev
            mkdir -p "$cache/root"
            sudo cp -a /usr/lib/llvm-21 "$cache/llvm-21"
            # Ubuntu splits the headers and libLLVM out of the tree: the in-tree symlinks
            # would dangle if only /usr/lib/llvm-21 were cached, so keep the real files
            # under their absolute paths too (issue #46).
            for extra in /usr/include/llvm-21 /usr/include/llvm-c-21; do
              if [ -e "$extra" ]; then sudo cp -a --parents "$extra" "$cache/root"; fi
            done
            for link in /usr/lib/llvm-21/lib/libLLVM*.so*; do
              if [ -L "$link" ]; then readlink -f "$link"; fi
            done | sort -u | while read -r target; do
              case "$target" in
                "" | /usr/lib/llvm-21/*) ;;
                *) sudo cp -a --parents "$target" "$cache/root" ;;
              esac
            done
          fi

      # rust-toolchain.toml pins the channel and the clippy/rustfmt components.
      - name: Install Rust (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Verify pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          case "$(rustc --version)" in
            "rustc $channel "*) ;;
            *) echo "expected rustc $channel, got $(rustc --version)"; exit 1 ;;
          esac
          rustup component list --installed | grep -q '^clippy-' || { echo "clippy is missing"; exit 1; }
          rustup component list --installed | grep -q '^rustfmt-' || { echo "rustfmt is missing"; exit 1; }

      - name: Check test directives
        run: tests/check-tests.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Build
        run: cargo build

      # The benchmark smoke run compiles every stage once and enforces generous time budgets, so a hang or an
      # accidental super-linear change fails CI (issue #41). Threshold tracking is issue #446.
      - name: Compiler benchmarks (smoke budgets)
        run: cargo bench -p burdin_bench -- --smoke

      - name: Check documentation
        run: tests/check-docs.sh

      - name: Check host target
        run: tests/check-platform.sh

      # Only milestones that are finished must pass. Extend the list as milestones are completed.
      - name: Conformance tests (finished milestones)
        run: tests/run-tests.sh m01 m02 m03 m04 m05 m06 m07 m08 m09 m10 m11

      # Overflow panics in debug and wraps in release, so the finished milestones also run under
      # the release profile, which exercises release code generation; tests marked debug-only are
      # skipped (issue #47).
      - name: Conformance tests (release profile)
        run: tests/run-tests.sh --release m01 m02 m03 m04 m05 m06 m07 m08 m09 m10 m11

  # macOS on arm64: proves the host-triple target, the C libc calls, and LLVM-C linking on Apple's
  # toolchain (issues #16, #17, #18). Homebrew's LLVM is keg-only, so point inkwell at its prefix and
  # put its llvm-config on PATH for `--link-lib LLVM-C`.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CI workflow
        run: tests/check-ci.sh

      # The cache key is the pinned toolchain plus Cargo.lock, so a toolchain bump or a
      # dependency change starts a fresh cache instead of reusing stale artifacts (issue #46).
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # Homebrew pours llvm@21 from a bottle. Cache the downloads so a warm run does not
      # fetch the bottle and its dependencies again. `brew install` still runs, because the
      # keg is not self-contained: Homebrew must install the libraries it links against
      # (issue #46).
      - name: Cache Homebrew downloads for LLVM 21
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-llvm-21

      - name: Install LLVM 21
        run: |
          brew install llvm@21
          echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"

      # rust-toolchain.toml pins the channel and the clippy/rustfmt components.
      - name: Install Rust (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Verify pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          case "$(rustc --version)" in
            "rustc $channel "*) ;;
            *) echo "expected rustc $channel, got $(rustc --version)"; exit 1 ;;
          esac
          rustup component list --installed | grep -q '^clippy-' || { echo "clippy is missing"; exit 1; }
          rustup component list --installed | grep -q '^rustfmt-' || { echo "rustfmt is missing"; exit 1; }

      - name: Check test directives
        run: tests/check-tests.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Build
        run: cargo build

      # The benchmark smoke run compiles every stage once and enforces generous time budgets, so a hang or an
      # accidental super-linear change fails CI (issue #41). Threshold tracking is issue #446.
      - name: Compiler benchmarks (smoke budgets)
        run: cargo bench -p burdin_bench -- --smoke

      - name: Check documentation
        run: tests/check-docs.sh

      # The LLVM target machine, isize/usize width, and generated object must follow the arm64 host.
      - name: Check host target
        run: tests/check-platform.sh

      # Only milestones that are finished must pass. Extend the list as milestones are completed.
      - name: Conformance tests (finished milestones)
        run: tests/run-tests.sh m01 m02 m03 m04 m05 m06 m07 m08 m09 m10 m11

      # Overflow panics in debug and wraps in release, so the finished milestones also run under
      # the release profile, which exercises release code generation; tests marked debug-only are
      # skipped (issue #47).
      - name: Conformance tests (release profile)
        run: tests/run-tests.sh --release m01 m02 m03 m04 m05 m06 m07 m08 m09 m10 m11

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      LLVM_SYS_211_PREFIX: C:/llvm
    steps:
      - uses: actions/checkout@v4

      - name: Check CI workflow
        run: bash tests/check-ci.sh

      # `cl` is not on PATH until the Visual Studio environment is loaded. This action exports INCLUDE, LIB,
      # PATH, and the rest to the steps that follow, exactly like a Developer Command Prompt.
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Git for Windows ships a coreutils `link.exe` in `usr/bin`. On the current runner image rustc can pick it
      # up instead of MSVC's linker, which fails with "extra operand" while linking build scripts. Name the
      # MSVC linker for the target explicitly so the choice does not depend on PATH order.
      - name: Configure the MSVC linker
        run: |
          linker="${VCToolsInstallDir}bin\\HostX64\\x64\\link.exe"
          test -x "$(cygpath -u "$linker")"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> "$GITHUB_ENV"

      # The cache key is the pinned toolchain plus Cargo.lock, so a toolchain bump or a
      # dependency change starts a fresh cache instead of reusing stale artifacts (issue #46).
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # The official Windows release archive is the only LLVM 21 distribution that ships llvm-config.exe
      # (llvm-sys needs it) and the LLVM-C import library. It is ~900 MB, so the archive is cached and the job
      # only downloads it on the first run; the unpacked tree is four times larger and not worth caching (#46).
      - name: Cache LLVM 21
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:/llvm-cache/llvm.tar.xz
          key: ${{ runner.os }}-llvm-21

      - name: Install LLVM 21
        run: |
          archive=/c/llvm-cache/llvm.tar.xz
          if [ "${{ steps.cache-llvm.outputs.cache-hit }}" != "true" ]; then
            mkdir -p /c/llvm-cache
            curl -fsSL -o "$archive" \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/clang+llvm-21.1.8-x86_64-pc-windows-msvc.tar.xz"
          fi
          mkdir -p /c/llvm
          tar -xJf "$archive" -C /c/llvm --strip-components=1

      # `C:/llvm/bin` goes on PATH so LLVM-C.dll is found when the compiler or a program built with
      # `--link-lib LLVM-C` runs. The checks run on both a cache hit and a miss.
      - name: Verify LLVM 21
        run: |
          test -x "C:/llvm/bin/llvm-config.exe"
          test -f "C:/llvm/lib/LLVM-C.lib"
          echo 'C:\llvm\bin' >> "$GITHUB_PATH"

      # rust-toolchain.toml pins the channel and the clippy/rustfmt components.
      - name: Install Rust (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Verify pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          case "$(rustc --version)" in
            "rustc $channel "*) ;;
            *) echo "expected rustc $channel, got $(rustc --version)"; exit 1 ;;
          esac
          rustup component list --installed | grep -q '^clippy-' || { echo "clippy is missing"; exit 1; }
          rustup component list --installed | grep -q '^rustfmt-' || { echo "rustfmt is missing"; exit 1; }

      - name: Check test directives
        run: bash tests/check-tests.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Build
        run: cargo build

      # The benchmark smoke run compiles every stage once and enforces generous time budgets, so a hang or an
      # accidental super-linear change fails CI (issue #41). Threshold tracking is issue #446.
      - name: Compiler benchmarks (smoke budgets)
        run: cargo bench -p burdin_bench -- --smoke

      - name: Check documentation
        run: bash tests/check-docs.sh

      - name: Check host target
        run: bash tests/check-platform.sh

      # Only milestones that are finished must pass. Extend the list as milestones are completed.
      - name: Conformance tests (finished milestones)
        run: bash tests/run-tests.sh m01 m02 m03 m04 m05 m06 m07 m08 m09 m10 m11

      # Overflow panics in debug and wraps in release, so the finished milestones also run under
      # the release profile, which exercises release code generation; tests marked debug-only are
      # skipped (issue #47).
      - name: Conformance tests (release profile)
        run: bash tests/run-tests.sh --release m01 m02 m03 m04 m05 m06 m07 m08 m09 m10 m11

      # The default linker on Windows is already `cl`; this proves the `BURDIN_CC` override takes the same path.
      - name: Conformance tests with BURDIN_CC=cl
        run: BURDIN_CC=cl bash tests/run-tests.sh m01_hello m11_llvm
